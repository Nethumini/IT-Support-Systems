<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1100" viewBox="0 0 1700 1100" role="img" aria-labelledby="title desc">
  <title id="title">Logical architecture of AutoOps AI and its controlled execution boundary</title>
  <desc id="desc">Four logical layers show the React interface, FastAPI application with probabilistic assistants and deterministic control services, SQLite persistence, and restricted execution drivers. Registered actions cross the driver boundary to an enrolled endpoint, while observed state returns for verification. Model output cannot cross the execution boundary directly.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2F6F9F"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#66509A"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#2E7D4F"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#657080"/>
    </marker>
    <filter id="shadow" x="-8%" y="-10%" width="116%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#172033" flood-opacity="0.13"/>
    </filter>
    <style>
      .title { font: 700 35px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #596579; }
      .layer { font: 700 19px Arial, Helvetica, sans-serif; fill: #ffffff; letter-spacing: 0.5px; }
      .group-title { font: 700 23px Arial, Helvetica, sans-serif; fill: #172033; }
      .box-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #172033; }
      .box-text { font: 400 16px Arial, Helvetica, sans-serif; fill: #34445c; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #34445c; }
      .legend { font: 400 15px Arial, Helvetica, sans-serif; fill: #34445c; }
    </style>
  </defs>

  <rect width="1700" height="1100" fill="#ffffff"/>
  <text x="850" y="48" text-anchor="middle" class="title">AutoOps AI logical architecture</text>
  <text x="850" y="78" text-anchor="middle" class="subtitle">Language-model assistance is separated from deterministic execution authority</text>

  <!-- Layer 1: Presentation -->
  <rect x="65" y="110" width="1570" height="120" rx="18" fill="#F7FAFC" stroke="#2F6F9F" stroke-width="3"/>
  <rect x="65" y="110" width="195" height="120" rx="18" fill="#2F6F9F"/>
  <rect x="240" y="110" width="20" height="120" fill="#2F6F9F"/>
  <text x="162" y="164" text-anchor="middle" class="layer">LAYER 1</text>
  <text x="162" y="192" text-anchor="middle" class="layer">PRESENTATION</text>
  <text x="500" y="158" text-anchor="middle" class="group-title">React user interface</text>
  <text x="500" y="191" text-anchor="middle" class="box-text">Chat · tickets · risk · approvals · devices</text>
  <text x="1140" y="158" text-anchor="middle" class="group-title">Review and oversight views</text>
  <text x="1140" y="191" text-anchor="middle" class="box-text">Knowledge drafts · remediation status · audit records</text>

  <!-- Layer 2: Application -->
  <rect x="65" y="270" width="1570" height="410" rx="18" fill="#FAFBFD" stroke="#66509A" stroke-width="3"/>
  <rect x="65" y="270" width="195" height="410" rx="18" fill="#66509A"/>
  <rect x="240" y="270" width="20" height="410" fill="#66509A"/>
  <text x="162" y="438" text-anchor="middle" class="layer">LAYER 2</text>
  <text x="162" y="466" text-anchor="middle" class="layer">APPLICATION</text>
  <text x="162" y="494" text-anchor="middle" class="layer">AND CONTROL</text>

  <g filter="url(#shadow)">
    <rect x="300" y="305" width="1275" height="75" rx="14" fill="#DCEEFF" stroke="#2F6F9F" stroke-width="2.5"/>
  </g>
  <text x="938" y="337" text-anchor="middle" class="group-title">Authenticated FastAPI endpoints and service coordination</text>
  <text x="938" y="363" text-anchor="middle" class="small">Conversations · tickets · knowledge · devices · remediation · audit</text>

  <!-- Probabilistic group -->
  <g filter="url(#shadow)">
    <rect x="300" y="420" width="470" height="215" rx="16" fill="#EAE4F8" stroke="#66509A" stroke-width="2.5"/>
  </g>
  <text x="535" y="454" text-anchor="middle" class="group-title">Probabilistic assistance</text>
  <text x="535" y="482" text-anchor="middle" class="small">Interpretation and proposal — no execution authority</text>
  <rect x="330" y="510" width="190" height="90" rx="12" fill="#ffffff" stroke="#8B79B7" stroke-width="2"/>
  <text x="425" y="542" text-anchor="middle" class="box-title">Specialised agents</text>
  <text x="425" y="568" text-anchor="middle" class="box-text">chat · tickets · image</text>
  <text x="425" y="590" text-anchor="middle" class="box-text">status · action proposal</text>
  <rect x="550" y="510" width="190" height="90" rx="12" fill="#ffffff" stroke="#8B79B7" stroke-width="2"/>
  <text x="645" y="542" text-anchor="middle" class="box-title">Retrieval</text>
  <text x="645" y="568" text-anchor="middle" class="box-text">approved knowledge</text>
  <text x="645" y="590" text-anchor="middle" class="box-text">and cited evidence</text>

  <!-- Deterministic group -->
  <g filter="url(#shadow)">
    <rect x="830" y="420" width="745" height="215" rx="16" fill="#FFF3CD" stroke="#9A7516" stroke-width="2.5"/>
  </g>
  <text x="1202" y="454" text-anchor="middle" class="group-title">Deterministic control and enforcement</text>
  <text x="1202" y="482" text-anchor="middle" class="small">Only registered actions and validated parameters may proceed</text>
  <rect x="860" y="510" width="155" height="90" rx="12" fill="#ffffff" stroke="#B48C26" stroke-width="2"/>
  <text x="938" y="544" text-anchor="middle" class="box-title">Risk engine</text>
  <text x="938" y="572" text-anchor="middle" class="box-text">score + overrides</text>
  <rect x="1035" y="510" width="155" height="90" rx="12" fill="#ffffff" stroke="#B48C26" stroke-width="2"/>
  <text x="1112" y="544" text-anchor="middle" class="box-title">Authorization</text>
  <text x="1112" y="572" text-anchor="middle" class="box-text">scoped authority</text>
  <rect x="1210" y="510" width="155" height="90" rx="12" fill="#ffffff" stroke="#B48C26" stroke-width="2"/>
  <text x="1288" y="544" text-anchor="middle" class="box-title">Remediation</text>
  <text x="1288" y="572" text-anchor="middle" class="box-text">state machine</text>
  <rect x="1385" y="510" width="160" height="90" rx="12" fill="#ffffff" stroke="#B48C26" stroke-width="2"/>
  <text x="1465" y="544" text-anchor="middle" class="box-title">Verification</text>
  <text x="1465" y="572" text-anchor="middle" class="box-text">contracts + recovery</text>

  <!-- Proposal arrow between authority domains -->
  <path d="M770 545 H820" fill="none" stroke="#66509A" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="795" y="526" text-anchor="middle" class="small">proposal</text>

  <!-- Layer 3: Persistence -->
  <rect x="65" y="720" width="760" height="150" rx="18" fill="#F7FAFC" stroke="#657080" stroke-width="3"/>
  <rect x="65" y="720" width="195" height="150" rx="18" fill="#657080"/>
  <rect x="240" y="720" width="20" height="150" fill="#657080"/>
  <text x="162" y="783" text-anchor="middle" class="layer">LAYER 3</text>
  <text x="162" y="811" text-anchor="middle" class="layer">PERSISTENCE</text>
  <text x="515" y="766" text-anchor="middle" class="group-title">SQLite through SQLAlchemy</text>
  <text x="515" y="799" text-anchor="middle" class="box-text">Users · tickets · conversations · remediation state</text>
  <text x="515" y="825" text-anchor="middle" class="box-text">device jobs · knowledge drafts · audit events</text>

  <!-- Layer 4: Driver boundary -->
  <rect x="875" y="720" width="760" height="150" rx="18" fill="#F7FAFC" stroke="#2F6F9F" stroke-width="3"/>
  <rect x="875" y="720" width="195" height="150" rx="18" fill="#2F6F9F"/>
  <rect x="1050" y="720" width="20" height="150" fill="#2F6F9F"/>
  <text x="972" y="783" text-anchor="middle" class="layer">LAYER 4</text>
  <text x="972" y="811" text-anchor="middle" class="layer">DRIVER BOUNDARY</text>
  <text x="1350" y="766" text-anchor="middle" class="group-title">Restricted execution interface</text>
  <text x="1350" y="799" text-anchor="middle" class="box-text">Simulator · POSIX · PowerShell · endpoint agent</text>
  <text x="1350" y="825" text-anchor="middle" class="box-text">Registered templates; structured inputs and outputs</text>

  <!-- Inter-layer connections -->
  <path d="M500 230 V295" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1150 305 V240" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M900 635 V690 H520 V710" fill="none" stroke="#657080" stroke-width="4" marker-end="url(#arrow-gray)"/>
  <path d="M1380 635 V710" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="1435" y="682" text-anchor="middle" class="small">registered action</text>

  <!-- Endpoint external to logical layers -->
  <g filter="url(#shadow)">
    <rect x="1020" y="930" width="460" height="105" rx="18" fill="#DFF4E4" stroke="#2E7D4F" stroke-width="3"/>
  </g>
  <text x="1250" y="970" text-anchor="middle" class="group-title">Enrolled Windows endpoint</text>
  <text x="1250" y="1001" text-anchor="middle" class="box-text">Action execution and local state observation</text>
  <path d="M1190 870 V920" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <path d="M1310 930 V880" fill="none" stroke="#2E7D4F" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="1398" y="910" text-anchor="middle" class="small">observed state</text>

  <!-- Explicit trust boundary -->
  <path d="M850 705 V1050" fill="none" stroke="#A94442" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="735" y="884" width="230" height="54" rx="10" fill="#FCE3DF" stroke="#A94442" stroke-width="2"/>
  <text x="850" y="907" text-anchor="middle" class="box-title">Execution boundary</text>
  <text x="850" y="928" text-anchor="middle" class="small">model text cannot cross</text>

  <!-- Legend -->
  <path d="M80 1045 H145" fill="none" stroke="#66509A" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrow-purple)"/>
  <text x="160" y="1051" class="legend">proposal or evidence</text>
  <path d="M335 1045 H400" fill="none" stroke="#2F6F9F" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="415" y="1051" class="legend">registered control/action</text>
  <path d="M625 1045 H690" fill="none" stroke="#2E7D4F" stroke-width="4" marker-end="url(#arrow-green)"/>
  <text x="705" y="1051" class="legend">observed state</text>
</svg>
