<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">High-level controlled remediation workflow in AutoOps AI</title>
  <desc id="desc">A nine-stage workflow from an authenticated support request through evidence retrieval, registered action proposal, deterministic risk assessment, graded authorization, precheck, controlled execution, observed postcondition, and verified completion or rollback and escalation. Every stage contributes to a persistent audit record.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#34445c"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#172033" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #596579; }
      .box-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #172033; }
      .box-text { font: 400 17px Arial, Helvetica, sans-serif; fill: #34445c; }
      .num { font: 700 17px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .arrow { fill: none; stroke: #34445c; stroke-width: 4; marker-end: url(#arrow); }
      .audit-link { fill: none; stroke: #657080; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="800" y="52" text-anchor="middle" class="title">Controlled remediation at a glance</text>
  <text x="800" y="82" text-anchor="middle" class="subtitle">Probabilistic assistance proposes; deterministic controls authorize, execute, and verify</text>

  <!-- Top row -->
  <g filter="url(#shadow)">
    <rect x="60" y="135" width="270" height="120" rx="16" fill="#DCEEFF" stroke="#2F6F9F" stroke-width="3"/>
    <circle cx="88" cy="163" r="18" fill="#2F6F9F"/>
    <text x="88" y="169" text-anchor="middle" class="num">1</text>
    <text x="120" y="174" text-anchor="start" class="box-title">Authenticated request</text>
    <text x="195" y="207" text-anchor="middle" class="box-text">User problem and</text>
    <text x="195" y="230" text-anchor="middle" class="box-text">available context</text>

    <rect x="400" y="135" width="270" height="120" rx="16" fill="#EAE4F8" stroke="#66509A" stroke-width="3"/>
    <circle cx="428" cy="163" r="18" fill="#66509A"/>
    <text x="428" y="169" text-anchor="middle" class="num">2</text>
    <text x="460" y="174" text-anchor="start" class="box-title">Evidence retrieval</text>
    <text x="535" y="207" text-anchor="middle" class="box-text">Approved support</text>
    <text x="535" y="230" text-anchor="middle" class="box-text">knowledge only</text>

    <rect x="740" y="135" width="270" height="120" rx="16" fill="#EAE4F8" stroke="#66509A" stroke-width="3"/>
    <circle cx="768" cy="163" r="18" fill="#66509A"/>
    <text x="768" y="169" text-anchor="middle" class="num">3</text>
    <text x="800" y="174" text-anchor="start" class="box-title">Registered proposal</text>
    <text x="875" y="207" text-anchor="middle" class="box-text">Supported action and</text>
    <text x="875" y="230" text-anchor="middle" class="box-text">validated parameters</text>

    <rect x="1080" y="135" width="270" height="120" rx="16" fill="#FFF3CD" stroke="#9A7516" stroke-width="3"/>
    <circle cx="1108" cy="163" r="18" fill="#9A7516"/>
    <text x="1108" y="169" text-anchor="middle" class="num">4</text>
    <text x="1140" y="174" text-anchor="start" class="box-title">Contextual risk</text>
    <text x="1215" y="207" text-anchor="middle" class="box-text">Deterministic score,</text>
    <text x="1215" y="230" text-anchor="middle" class="box-text">floors, and overrides</text>
  </g>

  <path class="arrow" d="M330 195 H390"/>
  <path class="arrow" d="M670 195 H730"/>
  <path class="arrow" d="M1010 195 H1070"/>
  <path class="arrow" d="M1215 255 V308 H1325 V365"/>

  <!-- Bottom row, read from right to left -->
  <g filter="url(#shadow)">
    <rect x="1190" y="365" width="270" height="120" rx="16" fill="#FFF3CD" stroke="#9A7516" stroke-width="3"/>
    <circle cx="1218" cy="393" r="18" fill="#9A7516"/>
    <text x="1218" y="399" text-anchor="middle" class="num">5</text>
    <text x="1250" y="404" text-anchor="start" class="box-title">Graded authorization</text>
    <text x="1325" y="437" text-anchor="middle" class="box-text">Low, medium, or high</text>
    <text x="1325" y="460" text-anchor="middle" class="box-text">risk-dependent route</text>

    <rect x="850" y="365" width="270" height="120" rx="16" fill="#EEF1F5" stroke="#657080" stroke-width="3"/>
    <circle cx="878" cy="393" r="18" fill="#657080"/>
    <text x="878" y="399" text-anchor="middle" class="num">6</text>
    <text x="920" y="404" text-anchor="start" class="box-title">Precheck</text>
    <text x="985" y="437" text-anchor="middle" class="box-text">Authority, target,</text>
    <text x="985" y="460" text-anchor="middle" class="box-text">contract, and state</text>

    <rect x="510" y="365" width="270" height="120" rx="16" fill="#DCEEFF" stroke="#2F6F9F" stroke-width="3"/>
    <circle cx="538" cy="393" r="18" fill="#2F6F9F"/>
    <text x="538" y="399" text-anchor="middle" class="num">7</text>
    <text x="570" y="404" text-anchor="start" class="box-title">Controlled execution</text>
    <text x="645" y="437" text-anchor="middle" class="box-text">Allow-listed driver;</text>
    <text x="645" y="460" text-anchor="middle" class="box-text">no generated shell code</text>

    <rect x="170" y="365" width="270" height="120" rx="16" fill="#DCEEFF" stroke="#2F6F9F" stroke-width="3"/>
    <circle cx="198" cy="393" r="18" fill="#2F6F9F"/>
    <text x="198" y="399" text-anchor="middle" class="num">8</text>
    <text x="230" y="404" text-anchor="start" class="box-title">Observed postcondition</text>
    <text x="305" y="437" text-anchor="middle" class="box-text">Compare relevant state,</text>
    <text x="305" y="460" text-anchor="middle" class="box-text">not command status alone</text>
  </g>

  <path class="arrow" d="M1190 425 H1130"/>
  <path class="arrow" d="M850 425 H790"/>
  <path class="arrow" d="M510 425 H450"/>
  <path class="arrow" d="M170 425 H120 V542 H315"/>

  <!-- Outcome and audit -->
  <g filter="url(#shadow)">
    <rect x="325" y="520" width="950" height="74" rx="16" fill="#DFF4E4" stroke="#2E7D4F" stroke-width="3"/>
    <circle cx="358" cy="557" r="18" fill="#2E7D4F"/>
    <text x="358" y="563" text-anchor="middle" class="num">9</text>
    <text x="800" y="550" text-anchor="middle" class="box-title">Verified outcome</text>
    <text x="800" y="578" text-anchor="middle" class="box-text">Complete only after verified success; otherwise verify rollback or escalate</text>
  </g>

  <path class="audit-link" d="M800 594 V635"/>

  <rect x="60" y="635" width="1400" height="70" rx="14" fill="#EEF1F5" stroke="#657080" stroke-width="3"/>
  <text x="800" y="665" text-anchor="middle" class="box-title">Persistent audit record across every stage</text>
  <text x="800" y="691" text-anchor="middle" class="box-text">Proposal · evidence · assessment · authority · observations · recovery · final state</text>
</svg>
