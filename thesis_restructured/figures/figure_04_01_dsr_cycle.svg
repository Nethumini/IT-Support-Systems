<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Design Science Research cycle applied in this study</title>
  <desc id="desc">A five-stage iterative cycle connects problem and gap identification, requirements, design and implementation, controlled evaluation, and refinement and communication around the AutoOps AI controlled-remediation artefact.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L13,6.5 L0,13 z" fill="#34445c"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#172033" flood-opacity="0.15"/>
    </filter>
    <style>
      .title { font: 700 35px Arial, Helvetica, sans-serif; fill: #172033; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #596579; }
      .stage-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #172033; }
      .stage-text { font: 400 17px Arial, Helvetica, sans-serif; fill: #34445c; }
      .stage-num { font: 700 20px Arial, Helvetica, sans-serif; fill: #ffffff; }
      .cycle { fill: none; stroke: #34445c; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="54" text-anchor="middle" class="title">Iterative Design Science Research cycle</text>
  <text x="800" y="85" text-anchor="middle" class="subtitle">Evidence and test findings fed back into the artefact before the frozen evaluation</text>

  <!-- Cycle arrows -->
  <path class="cycle" d="M955 190 C1100 195, 1190 245, 1250 330"/>
  <path class="cycle" d="M1325 455 C1315 575, 1235 650, 1115 696"/>
  <path class="cycle" d="M885 752 C710 790, 535 755, 435 690"/>
  <path class="cycle" d="M280 575 C230 470, 255 345, 350 275"/>
  <path class="cycle" d="M555 188 C650 132, 820 128, 930 167"/>

  <!-- Central artefact -->
  <g filter="url(#shadow)">
    <ellipse cx="800" cy="450" rx="265" ry="145" fill="#DCEEFF" stroke="#2F6F9F" stroke-width="4"/>
  </g>
  <text x="800" y="410" text-anchor="middle" class="stage-title">AutoOps AI artefact</text>
  <text x="800" y="444" text-anchor="middle" class="stage-text">Evidence-grounded, risk-adaptive,</text>
  <text x="800" y="470" text-anchor="middle" class="stage-text">authorized, restricted, verified,</text>
  <text x="800" y="496" text-anchor="middle" class="stage-text">recoverable, and auditable remediation</text>

  <!-- Stage 1 -->
  <g filter="url(#shadow)">
    <rect x="560" y="115" width="480" height="130" rx="18" fill="#FCE3DF" stroke="#A94442" stroke-width="3"/>
    <circle cx="600" cy="155" r="24" fill="#A94442"/>
  </g>
  <text x="600" y="162" text-anchor="middle" class="stage-num">1</text>
  <text x="640" y="157" text-anchor="start" class="stage-title">Problem and gap identification</text>
  <text x="800" y="193" text-anchor="middle" class="stage-text">Unsafe gap between AI recommendations</text>
  <text x="800" y="219" text-anchor="middle" class="stage-text">and trustworthy endpoint change</text>

  <!-- Stage 2 -->
  <g filter="url(#shadow)">
    <rect x="1120" y="320" width="400" height="150" rx="18" fill="#FFF3CD" stroke="#9A7516" stroke-width="3"/>
    <circle cx="1160" cy="360" r="24" fill="#9A7516"/>
  </g>
  <text x="1160" y="367" text-anchor="middle" class="stage-num">2</text>
  <text x="1195" y="362" text-anchor="start" class="stage-title">Requirements</text>
  <text x="1320" y="398" text-anchor="middle" class="stage-text">Derive safety, authority,</text>
  <text x="1320" y="424" text-anchor="middle" class="stage-text">verification, recovery, and</text>
  <text x="1320" y="450" text-anchor="middle" class="stage-text">audit requirements</text>

  <!-- Stage 3 -->
  <g filter="url(#shadow)">
    <rect x="880" y="675" width="470" height="145" rx="18" fill="#EAE4F8" stroke="#66509A" stroke-width="3"/>
    <circle cx="920" cy="715" r="24" fill="#66509A"/>
  </g>
  <text x="920" y="722" text-anchor="middle" class="stage-num">3</text>
  <text x="955" y="718" text-anchor="start" class="stage-title">Design and implementation</text>
  <text x="1115" y="754" text-anchor="middle" class="stage-text">Build the integrated control workflow,</text>
  <text x="1115" y="780" text-anchor="middle" class="stage-text">contracts, services, drivers, and interface</text>

  <!-- Stage 4 -->
  <g filter="url(#shadow)">
    <rect x="250" y="675" width="430" height="145" rx="18" fill="#DFF4E4" stroke="#2E7D4F" stroke-width="3"/>
    <circle cx="290" cy="715" r="24" fill="#2E7D4F"/>
  </g>
  <text x="290" y="722" text-anchor="middle" class="stage-num">4</text>
  <text x="325" y="718" text-anchor="start" class="stage-title">Controlled evaluation</text>
  <text x="465" y="754" text-anchor="middle" class="stage-text">Offline tests, comparative scenarios,</text>
  <text x="465" y="780" text-anchor="middle" class="stage-text">retrieval evaluation, and endpoint trial</text>

  <!-- Stage 5 -->
  <g filter="url(#shadow)">
    <rect x="80" y="320" width="400" height="150" rx="18" fill="#EEF1F5" stroke="#657080" stroke-width="3"/>
    <circle cx="120" cy="360" r="24" fill="#657080"/>
  </g>
  <text x="120" y="367" text-anchor="middle" class="stage-num">5</text>
  <text x="155" y="362" text-anchor="start" class="stage-title">Refinement and communication</text>
  <text x="280" y="398" text-anchor="middle" class="stage-text">Resolve discrepancies, freeze the</text>
  <text x="280" y="424" text-anchor="middle" class="stage-text">evaluated artefact, and report findings</text>
  <text x="280" y="450" text-anchor="middle" class="stage-text">with explicit limitations</text>
</svg>
